<!-- Drives the real Book a Court page module at a mobile width and asserts
     the court-per-page handoff's behaviour. Serve the repo root and open
     /test/court-booking-mobile.browser.html at <=768px wide - the title
     becomes PASS or FAIL. -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../renderer/styles.css"></head>
<body><div class="app-container"><div class="main-wrapper">
<header class="topbar"><h1 id="pageTitle"></h1><div id="topbarActions"></div></header>
<main class="content" id="mainContent" style="height:800px;display:flex;flex-direction:column"></main></div></div>
<div id="modalOverlay" style="display:none"><div id="modal"><div id="modalTitle"></div><div id="modalBody"></div><button id="modalClose"></button></div></div>
<div id="toastContainer"></div>
<pre id="log" style="position:fixed;inset:0;background:#fff;z-index:999;font:12px monospace;padding:12px;white-space:pre-wrap;overflow:auto"></pre>
<script type="module">
const out=[]; let fails=0;
const ok=(n,c,x='')=>{ if(!c) fails++; out.push((c?'  PASS  ':'  FAIL  ')+n+(x!==''?'  ['+x+']':'')); };
try {
// Pin the clock to 9 AM today: the fixture's bookings live at fixed wall
// times (5 PM on), so with a real clock the suite started failing every
// evening once "now" overtook them.
{
  const RealDate = Date;
  const fixed = new RealDate(); fixed.setHours(9, 0, 0, 0);
  const FIXED = fixed.getTime();
  window.Date = class extends RealDate {
    constructor(...a) { a.length ? super(...a) : super(FIXED); }
    static now() { return FIXED; }
  };
}
const { state } = await import('../renderer/state.js');
state.currentUser = { role:'user', playerId:42 };
state.players = [{ id:42, name:'Merak Lee' }];
const t=(m)=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const today = new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const courts=[1,2,3,4,5].map(i=>({id:i,name:i===5?'Doubles Court':'Court '+i,active:1,sort_order:i}));
const mk=(id,courtId,s,d,title,opts={})=>({id,courtId,startTime:t(s),durationMinutes:d,title,source:opts.source||'custom',players:opts.players||[],bookedBy:opts.bookedBy??null,name:title,info:opts.info||'',color:'#3550c8',bookingTypeId:opts.typeId??null,repeatGroupId:null,date:today});
const slots=[
  mk(1,1,17*60,60,'Merak Lee',{players:[{id:42,name:'Merak Lee'},{id:7,name:'Sofia Duarte'}],bookedBy:42}),
  mk(2,1,18*60+30,90,'League Match',{source:'league'}),
  mk(3,1,20*60+30,60,'Sofia Duarte',{players:[{id:7,name:'Sofia Duarte'}],bookedBy:7}),
  mk(4,2,17*60+30,60,'Priya Raman',{players:[{id:8,name:'Priya Raman'}],bookedBy:8}),
  // Court 4: bookings I am on but did not make. The club's lesson is titled by
  // its type; Sofia's booking by Sofia. Neither is mine to change.
  mk(7,4,18*60,60,'Private Lesson',{players:[{id:42,name:'Merak Lee'}],typeId:3}),
  mk(8,4,19*60,60,'Sofia Duarte',{players:[{id:7,name:'Sofia Duarte'},{id:42,name:'Merak Lee'}],bookedBy:7}),
  // Court 3: a league night. 45-minute matches back to back, so the second
  // starts at 9:15 - on no 30-minute step at all.
  mk(5,3,20*60+30,45,'League Match',{source:'league',info:'Merak Lee vs Sofia Duarte'}),
  mk(6,3,21*60+15,45,'League Match',{source:'league',info:'Priya Raman vs Alex Hupé'}),
  // A doubles fixture names both pairs; every name is shortened on a phone.
  mk(10,5,19*60,60,'League Match',{source:'league',info:'Ann Pair & Bo Pair vs Cy Pair & Di Pair',format:'doubles'}),
];
const calls=[];
let myRows=[];   // filled below, before the page first loads it
window.api = {
  getCourts: async()=>courts,
  getSchedule: async()=>({courts, slots}),
  getMyBookings: async()=>myRows,
  createReservation: async(d)=>{ calls.push(['reserve',d]); return { reservationId:'r1', expiresAt: Date.now()+300000 }; },
  deleteReservation: async()=>({}),
  releaseReservation: async()=>({}),
};
window.navigate=()=>{};
myRows=[
  {...slots[0], courtName:'Court 1', courtCount:1},
  {...slots.find(x=>x.id===7), courtName:'Court 4', courtCount:1},
  {...slots.find(x=>x.id===8), courtName:'Court 4', courtCount:1},
];
// The page refreshes the schedule every 30 seconds; the suite catches that
// timer so it can fire it when it wants to.
const refreshers=[]; const realSetInterval=window.setInterval;
window.setInterval=(fn,ms,...rest)=>{ if(ms===30000) refreshers.push(fn); return realSetInterval(fn,ms,...rest); };
document.getElementById('topbarActions').innerHTML='<span id="leftover">1 upcoming</span>';
const { renderCourtBooking } = await import('../renderer/pages/courtBooking.js');
const $=(s)=>document.querySelector(s), $$=(s)=>[...document.querySelectorAll(s)];
const tick=(ms=150)=>new Promise(r=>setTimeout(r,ms));
// The page decides mobile by width; the headless window is 500 so it is mobile.
renderCourtBooking(); await tick(300);

// ---- structure ----
ok('the top bar is cleared of the last page\'s leftovers', !document.getElementById('leftover') && document.getElementById('topbarActions').textContent==='');
ok('five court tabs in club order', $$('.cb-mtab').map(x=>x.textContent).join('|')==='Court 1|Court 2|Court 3|Court 4|Doubles Court');
ok('Court 1 selected by default', $('.cb-mtab').classList.contains('cb-mtab--on'));
ok('five dots, first elongated', $$('.cb-mdot').length===5 && $('.cb-mdot').classList.contains('cb-mdot--on'));
ok('rows exist for today', $$('.cb-mslot').length>0, $$('.cb-mslot').length);

// ---- booking rows: one row each, right kind, right texts ----
const mine=$('.cb-mslot--mine'), league=$('.cb-mslot--league'), other=$('.cb-mslot--other');
ok('own booking is one blue row titled by me, not "You"', !!mine && mine.querySelector('.cb-mslot-l1')?.textContent==='Merak Lee', mine?.querySelector('.cb-mslot-l')?.textContent);
ok('and says who it is with underneath', mine?.querySelector('.cb-mslot-l2')?.textContent==='with S. Duarte', mine?.querySelector('.cb-mslot-l2')?.textContent);
ok('and is mine to open', !!mine?.dataset.mbid);
ok('own booking mark is its range', mine?.querySelector('.cb-mslot-m').textContent==='5:00–6:00', mine?.querySelector('.cb-mslot-m').textContent);
ok('league booking renders amber with its title', !!league && league.querySelector('.cb-mslot-l').textContent==='League Match');
ok('a 90-minute booking is one row, not three', $$('.cb-mslot--league').length===1);
ok("someone else's booking is grey and inert", !!other && !other.dataset.mstart && !other.dataset.mbid);
ok('booked steps are skipped as open rows', !$$('.cb-mslot[data-mstart]').some(r=>['17:00','17:30','18:30','19:00','19:30','20:30'].includes(t(Number(r.dataset.mstart)))));
const firstOpen=$('.cb-mslot[data-mstart]');
ok('open rows say Open with a plus', firstOpen.querySelector('.cb-mslot-l').textContent==='Open' && firstOpen.querySelector('.cb-mslot-m').textContent==='+');

// ---- tab switch ----
$$('.cb-mtab')[1].click(); await tick();
ok('tab tap changes the page', $$('.cb-mtab')[1].classList.contains('cb-mtab--on') && $$('.cb-mdot')[1].classList.contains('cb-mdot--on'));
ok('the new page shows its own bookings', !!$('.cb-mslot--other') && $('.cb-mslot--other').querySelector('.cb-mslot-l').textContent==='Priya Raman');
ok("and not the old court's", !$('.cb-mslot--league'));

// ---- a league night: every match shows, at its real time ----
$$('.cb-mtab')[2].click(); await tick(300);
const night=$$('.cb-mslot--league');
ok('both matches are rows, the 9:15 one included', night.length===2, night.length);
ok('each at its own time, not snapped to a step', /8:30/.test(night[0]?.querySelector('.cb-mslot-t').textContent) && /9:15/.test(night[1]?.querySelector('.cb-mslot-t').textContent),
  night.map(r=>r.querySelector('.cb-mslot-t').textContent).join('|'));
ok('a match row says who is playing, short', night[0]?.querySelector('.cb-mslot-l1')?.textContent==='M. Lee vs S. Duarte' && night[1]?.querySelector('.cb-mslot-l1')?.textContent==='P. Raman vs A. Hupé',
  night.map(r=>r.querySelector('.cb-mslot-l1')?.textContent).join('|'));
ok('and what it is underneath', night.every(r=>r.querySelector('.cb-mslot-l2')?.textContent==='League match'));
const openAt=$$('.cb-mslot[data-mstart]').map(r=>Number(r.dataset.mstart));
ok('the steps the matches cover are not offered', !openAt.includes(21*60) && !openAt.includes(21*60+30), openAt.filter(m=>m>=20*60&&m<=22*60).map(t).join(','));
ok('the ones around them still are', openAt.includes(20*60) && openAt.includes(22*60));
const order=$$('.cb-mslot').map(r=>r.querySelector('.cb-mslot-t').textContent).join(',');
ok('rows read in time order', order.indexOf('8:30')<order.indexOf('9:15'));

// ---- a doubles league fixture ----
$$('.cb-mtab')[4].click(); await tick(300);
const dblRow=$('.cb-mslot--league');
ok('a doubles fixture shortens all four names, pairs kept', dblRow?.querySelector('.cb-mslot-l1')?.textContent==='A. Pair & B. Pair vs C. Pair & D. Pair', dblRow?.querySelector('.cb-mslot-l1')?.textContent);

// ---- bookings I am on but did not make ----
$$('.cb-mtab')[3].click(); await tick(300);
const onMe=$$('.cb-mslot--mine');
ok('both are coloured mine, since I am on them', onMe.length===2, onMe.length);
ok("the club's lesson is titled by its type", onMe[0]?.querySelector('.cb-mslot-l1')?.textContent==='Private Lesson', onMe[0]?.querySelector('.cb-mslot-l')?.textContent);
ok('with the people on it underneath', onMe[0]?.querySelector('.cb-mslot-l2')?.textContent==='M. Lee', onMe[0]?.querySelector('.cb-mslot-l2')?.textContent);
ok("Sofia's booking is titled by Sofia, with me underneath", onMe[1]?.querySelector('.cb-mslot-l1')?.textContent==='Sofia Duarte' && onMe[1]?.querySelector('.cb-mslot-l2')?.textContent==='with M. Lee', onMe[1]?.querySelector('.cb-mslot-l')?.textContent);
ok('neither opens an edit sheet: only the booker changes a booking', onMe.every(r=>!r.dataset.mbid));
$$('.cb-mtab')[1].click(); await tick(300);   // back to Court 2 for the reservation checks below


// ---- open tap books on the shown court ----
$('.cb-mslot[data-mstart]').click(); await tick(250);
const rsv=calls.find(c=>c[0]==='reserve');
ok('tapping an open row reserves on the shown court', rsv && rsv[1].courtId===2, rsv&&JSON.stringify(rsv[1]));
ok('the sheet opens', !!$('.cb-panel'));
ok('the tapped row shows Selected', $('.cb-mslot--sel')?.querySelector('.cb-mslot-m').textContent==='Selected');

// ---- your own hold never caps the duration ----
// After a refresh the schedule carries the hold as a Reserved slot at the
// very start being booked; the + button used to lock against it.
const durBefore=$('#cbDurValue')?.textContent;
slots.push(mk('rsv_r1',2,Number(rsv[1].startTime.slice(0,2))*60+Number(rsv[1].startTime.slice(3,5)),30,'Reserved',{source:'reservation'}));
ok('the refresh timer was caught', refreshers.length>0);
await refreshers.at(-1)?.(); await tick(150);
ok('the sheet is still open after the refresh', !!$('.cb-panel') && !!$('#cbDurPlus'));
ok('the + button is not locked by your own hold', !$('#cbDurPlus').disabled);
$('#cbDurPlus').click(); await tick();
ok('and adds half an hour', $('#cbDurValue')?.textContent!==durBefore, `${durBefore} -> ${$('#cbDurValue')?.textContent}`);
slots.pop();

// ---- switching court keeps the sheet open ----
$$('.cb-mtab')[0].click(); await tick();
ok('sheet stays open on another page', !!$('.cb-panel'));
ok('selection not highlighted on this page', !$('.cb-mslot--sel'));
document.getElementById('cbPanelCancel')?.click(); await tick(700);   // let the sheet finish closing before touching the list

// ---- own booking opens the edit sheet ----
$('.cb-mslot[data-mbid]')?.click(); await tick(250);
ok('own row opens the edit sheet', !!$('.cb-panel') && document.body.textContent.includes('Cancel booking'), $('.cb-panel')?'panel':'none');
document.getElementById('cbPanelClose')?.click(); await tick(250);

// ---- My Bookings lists what I made and what I am on, and only mine can be edited ----
$('.cb-tab[data-tab="mine"]').click(); await tick(300);
const mrows=$$('.cb-mmine-row');
ok('three rows in My Bookings', mrows.length===3, mrows.length);
ok('each titled by the rule: me, the type, the booker', mrows.map(r=>r.querySelector('.cb-mmine-court').textContent).join('|')==='Merak Lee|Private Lesson|Sofia Duarte', mrows.map(r=>r.querySelector('.cb-mmine-court').textContent).join('|'));
ok('the court moved to the line beneath', /^Court 1 · /.test(mrows[0]?.querySelector('.cb-mmine-when').textContent), mrows[0]?.querySelector('.cb-mmine-when').textContent);
ok('and who it is with beneath that', mrows.map(r=>r.querySelector('.cb-mmine-who')?.textContent).join('|')==='with S. Duarte|M. Lee|with M. Lee', mrows.map(r=>r.querySelector('.cb-mmine-who')?.textContent).join('|'));
ok('only the booking I made has an Edit button', mrows.map(r=>!!r.querySelector('.cb-mine-edit')).join()==='true,false,false');
// The list is only re-read on a booking, a cancel or a pull to refresh, so
// the empty case below gets a fresh page.
myRows=[];
renderCourtBooking(); await tick(300);

// ---- past date: no rows, the empty line ----
const { state: st } = await import('../renderer/state.js');
document.getElementById('cbPrevDay').click(); await tick(250);
ok('yesterday shows no rows', $$('.cb-mslot').length===0);
ok('and says so', $('.cb-mempty')?.textContent==='No times left on this day.');
ok('the court page carried over', $('.cb-mtab').classList.contains('cb-mtab--on'));

// ---- My Bookings with nothing booked ----
$('.cb-tab[data-tab="mine"]').click(); await tick(300);
const empty=$('.cb-mmine-card .cb-rail-empty');
ok('the empty My Bookings tab says so', empty?.textContent==='No upcoming bookings.', empty?.textContent);
ok('with room above and below the line, not jammed against the card', empty && parseFloat(getComputedStyle(empty).paddingTop)>=20 && parseFloat(getComputedStyle(empty).paddingBottom)>=20, empty && getComputedStyle(empty).padding);
} catch (e) { fails++; out.push('  THREW  '+e.message+'\n'+(e.stack||'').split('\n').slice(0,4).join('\n')); }
document.getElementById('log').textContent = out.join('\n')+'\n\n'+(fails? fails+' FAILED':'ALL '+out.length+' PASSED');
document.title = fails? 'FAIL':'PASS';
</script></body></html>
