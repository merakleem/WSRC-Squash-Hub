<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RUNNING</title>
<link rel="stylesheet" href="../renderer/styles.css">
<style>#log{position:fixed;inset:0;background:#fff;color:#111;font:12px/1.5 monospace;padding:14px;overflow:auto;z-index:9999;margin:0;white-space:pre-wrap}</style>
</head>
<body>
<div class="main-wrapper" style="position:relative;min-height:100vh">
  <div id="pageTitle"></div><div id="topbarActions"></div>
  <main class="content" id="mainContent"></main>
</div>
<div id="modalOverlay" class="modal-overlay"><div id="modal" class="modal"><div class="modal-header"><span id="modalTitle"></span><button id="modalClose" class="modal-close">&times;</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="toastContainer"></div>
<pre id="log"></pre>
<script type="module">
// The league page for a league that plays two days a week
// (design_handoff_league_multinight §1–2): the week header's date range,
// each week grouped by day then division, the TODAY chip, the empty-day row
// under a division filter, the week-level byes line, and the hero's play
// days. Run at 1280 and at 390.
const log = document.getElementById('log');
let failed = 0;
const ok = (name, cond, extra = '') => {
  log.textContent += (cond ? 'PASS ' : 'FAIL ') + name + (extra !== '' ? ` [${extra}]` : '') + '\n';
  if (!cond) failed++;
};
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const txt = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');
const vis = (el) => !!el && !el.hidden && getComputedStyle(el).display !== 'none';
const click = (el) => el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
const settle = (ms = 40) => new Promise((r) => setTimeout(r, ms));
const mobile = window.innerWidth <= 768;

// Dates on the browser's own clock (the page reads "today" the same way):
// this week's Monday is week 1, and today is one of week 1's play days, so
// the TODAY chip has somewhere to land whatever day this runs.
const iso = (d) => new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const today = iso(new Date());
const todayDow = new Date(today + 'T12:00:00').getDay();
const monday = addDays(today, -((todayDow - 1 + 7) % 7));
const PLAY_DAYS = todayDow === 1 ? [1, 3] : [1, todayDow];
const secondOffset = (PLAY_DAYS[1] - 1 + 7) % 7;
const W1 = monday, W1B = addDays(monday, secondOffset);
const W2 = addDays(monday, 7), W2B = addDays(W2, secondOffset);
const md = (s) => new Date(s + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const year = new Date(W1B + 'T12:00:00').getFullYear();
const DAY_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const DAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

const NAMES = ['Ann One', 'Bo One', 'Cy One', 'Di One', 'Ed Two', 'Flo Two', 'Gus Two'];
const P = NAMES.map((name, i) => ({ id: i + 1, name, photo_path: null }));
const nm = (id) => P[id - 1].name;
const m = (id, muId, divId, p1, p2, date, s1 = null, s2 = null) => ({
  id, matchup_id: muId, division_id: divId, division_name: divId === 59 ? 'Division 1' : 'Division 2', division_level: divId === 59 ? 1 : 2,
  player1_id: p1, player2_id: p2, player1_name: nm(p1), player2_name: nm(p2), player1_score: s1, player2_score: s2,
  winner_id: s1 == null ? null : (s1 > s2 ? p1 : p2), skipped: 0, match_time: '19:00', court_id: 1, court_name: 'Court 1',
  scheduled_date: date, sub1_id: null, sub1_name: null, sub2_id: null, sub2_name: null,
});
const LEAGUE = () => ({
  id: 12, name: 'Two-day League', start_date: W1, status: 'active', setup_type: 'modern', num_divisions: 2, num_rounds: 1, num_courts: 1, schedule_courts: 1,
  play_days: PLAY_DAYS,
  divisions: [{ id: 59, league_id: 12, name: 'Division 1', level: 1 }, { id: 60, league_id: 12, name: 'Division 2', level: 2 }],
  players: P.map((p) => ({ player_id: p.id, player_name: p.name, division_id: p.id <= 4 ? 59 : 60, division_name: p.id <= 4 ? 'Division 1' : 'Division 2', division_level: p.id <= 4 ? 1 : 2, skill_rank: p.id })),
  pairs: [], teams: [], courts: [{ id: 1, name: 'Court 1' }],
  weeks: [
    { id: 100, league_id: 12, week_number: 1, date: W1, matchups: [
      { id: 1000, week_id: 100, division_id: 59, division_name: 'Division 1', division_level: 1, matches: [m(1, 1000, 59, 1, 2, W1, 3, 1), m(2, 1000, 59, 3, 4, W1)] },
      { id: 1001, week_id: 100, division_id: 60, division_name: 'Division 2', division_level: 2, matches: [m(3, 1001, 60, 5, 6, W1B)] },
    ], byes: [{ id: 5, week_id: 100, player_id: 7, player_name: nm(7), division_id: 60, division_name: 'Division 2', division_level: 2 }] },
    { id: 101, league_id: 12, week_number: 2, date: W2, matchups: [
      { id: 1002, week_id: 101, division_id: 59, division_name: 'Division 1', division_level: 1, matches: [m(4, 1002, 59, 1, 3, W2), m(5, 1002, 59, 2, 4, W2B)] },
      { id: 1003, week_id: 101, division_id: 60, division_name: 'Division 2', division_level: 2, matches: [m(6, 1003, 60, 5, 7, W2B)] },
    ], byes: [{ id: 6, week_id: 101, player_id: 6, player_name: nm(6), division_id: 60, division_name: 'Division 2', division_level: 2 }] },
  ],
});
window.api = { getLeague: async () => LEAGUE(), getPlayers: async () => P, getCourts: async () => [{ id: 1, name: 'Court 1' }] };
window.navigate = () => {};
window.openPlayerProfile = () => {};
const { state } = await import('../renderer/state.js');
const mod = await import('../renderer/pages/leagueDetail.js');
state.players = P;
const render = async (user) => { state.currentUser = user; state.currentLeague = LEAGUE(); mod.resetLeagueEditMode(); mod.renderLeagueDetail(); await settle(); };

try {
  await render({ role: 'player', playerId: 1 });
  log.textContent += (mobile ? 'PHONE' : 'DESKTOP') + ' — HERO\n';
  ok('the meta line ends with the play days', txt($('.lg-hero-meta')) === `2 divisions · 7 players · 2 weeks · ${DAY_SHORT[1]} & ${DAY_SHORT[PLAY_DAYS[1]]}`, txt($('.lg-hero-meta')));
  ok('the progress range ends on the last day played', new RegExp(new Date(W2B + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).replace('.', '\\.') + '$').test(txt($('.lg-progress-dates'))), txt($('.lg-progress-dates')));

  log.textContent += '\nSCHEDULE — DIVISION 1 SELECTED\n';
  click($$('.lg-tab')[1]); await settle();
  const week1 = $('.lg-week[data-week-id="100"]');
  ok('week 1 is this week', week1.classList.contains('lg-week-current') && !!week1.querySelector('.lg-thisweek'));
  click(week1.querySelector('.lg-week-header')); await settle();
  ok('opening it shows its body', getComputedStyle(week1.querySelector('.lg-week-body')).display !== 'none');
  const dateEl = week1.querySelector('.lg-week-date');
  ok('the header carries a date range', dateEl.classList.contains('lg-week-date--range'));
  const longRange = `${md(W1)} – ${md(W1B)}, ${year}`;
  if (mobile) {
    ok('the phone shows the short range', vis(dateEl.querySelector('.lg-wd-short')) && !vis(dateEl.querySelector('.lg-wd-long')) && /–/.test(txt(dateEl.querySelector('.lg-wd-short'))), txt(dateEl.querySelector('.lg-wd-short')));
  } else {
    ok('the desktop shows weekdays and the year once', vis(dateEl.querySelector('.lg-wd-long')) && txt(dateEl.querySelector('.lg-wd-long')) === longRange, txt(dateEl.querySelector('.lg-wd-long')));
    ok('and the date column is wide enough for it', Math.round(parseFloat(getComputedStyle(dateEl).minWidth)) === 230, getComputedStyle(dateEl).minWidth);
  }
  ok('the header names the range for a reader', week1.querySelector('.lg-week-header').getAttribute('aria-label') === `Week 1, ${longRange}`);
  ok('the summary counts the whole week', txt(week1.querySelector('.lg-week-summary')) === '1 of 3 played', txt(week1.querySelector('.lg-week-summary')));
  const nights = [...week1.querySelectorAll('.lg-night')];
  ok('the week has one group per play day, in play order', nights.length === 2 && nights.map((n) => txt(n.querySelector('.lg-night-day'))).join('|') === `${DAY_LONG[1]}|${DAY_LONG[PLAY_DAYS[1]]}`, nights.map((n) => txt(n.querySelector('.lg-night-day'))).join('|'));
  ok('each names its date', txt(nights[0].querySelector('.lg-night-date')).endsWith(new Date(W1 + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })), txt(nights[0].querySelector('.lg-night-date')));
  ok('the Monday counts my division\'s two matches', txt(nights[0].querySelector('.lg-night-count')) === '2 matches' && nights[0].querySelectorAll('.match-row').length === 2);
  ok('inside a Division 1 block', txt(nights[0].querySelector('.lg-group-title')) === 'Division 1' && !vis(nights[0].querySelector('.lg-night-empty')));
  ok('the other day has none of mine and says so', txt(nights[1].querySelector('.lg-night-count')) === '0 matches' && vis(nights[1].querySelector('.lg-night-empty')) && txt(nights[1].querySelector('.lg-night-empty')) === 'No Division 1 matches this day', txt(nights[1].querySelector('.lg-night-empty')));
  ok('with its Division 2 block hidden, not gone', nights[1].querySelector('.matchup-block[data-division-id="60"]')?.hidden === true);
  const todayChip = $$('.lg-tonight');
  ok('exactly one TODAY chip, on today\'s group', todayChip.length === 1 && todayChip[0].closest('.lg-night').dataset.date === today && txt(todayChip[0]) === 'TODAY', todayChip.map((c) => c.closest('.lg-night').dataset.date).join());
  ok('and it never says tonight', !/tonight/i.test($('#scheduleList').textContent));
  ok('the byes line is hidden while Division 1 is selected', !vis(week1.querySelector('.lg-week-byes')));
  ok('match rows are the usual ones', week1.querySelector('.match-row.lg-match') && /19:00/.test(txt(week1.querySelector('.match-court-label'))));

  log.textContent += '\nSCHEDULE — DIVISION 2 SELECTED\n';
  click($$('.std-tab').find((p) => p.dataset.divId === '60')); await settle();
  const n2 = [...week1.querySelectorAll('.lg-night')];
  ok('the day headings stay', n2.length === 2 && n2.map((n) => txt(n.querySelector('.lg-night-day'))).join('|') === `${DAY_LONG[1]}|${DAY_LONG[PLAY_DAYS[1]]}`);
  ok('the counts follow the division', txt(n2[0].querySelector('.lg-night-count')) === '0 matches' && txt(n2[1].querySelector('.lg-night-count')) === '1 match');
  ok('the empty row moves to the Monday', vis(n2[0].querySelector('.lg-night-empty')) && txt(n2[0].querySelector('.lg-night-empty')) === 'No Division 2 matches this day' && !vis(n2[1].querySelector('.lg-night-empty')));
  ok('the byes line shows the week\'s bye with its division', vis(week1.querySelector('.lg-week-byes')) && txt(week1.querySelector('.lg-week-byes')) === 'Byes · Gus Two (Division 2)', txt(week1.querySelector('.lg-week-byes')));
  const week2 = $('.lg-week[data-week-id="101"]');
  ok('week 2 has no TODAY chip', !week2.querySelector('.lg-tonight'));
  if (mobile) {
    const gap = n2[1].getBoundingClientRect().top - n2[0].getBoundingClientRect().bottom;
    ok('phone groups sit 16px apart', Math.round(gap) === 16, String(gap));
  } else {
    ok('desktop groups are divided by a hairline', getComputedStyle(n2[1]).borderTopWidth === '1px' && getComputedStyle(n2[0]).borderTopWidth === '0px');
    ok('with the handoff\'s padding', getComputedStyle(n2[0]).paddingLeft === '22px' && getComputedStyle(n2[0]).paddingTop === '14px');
  }

  log.textContent += '\nONE-DAY LEAGUE IS UNCHANGED\n';
  const one = LEAGUE(); one.play_days = [1];
  one.weeks.forEach((w) => w.matchups.forEach((mu) => mu.matches.forEach((x) => { x.scheduled_date = w.date; })));
  state.currentUser = { role: 'player', playerId: 1 }; state.currentLeague = one; mod.resetLeagueEditMode(); mod.renderLeagueDetail(); await settle();
  click($$('.lg-tab')[1]); await settle();
  ok('no day groups', $$('.lg-night').length === 0 && $$('.lg-week-byes').length === 0);
  ok('a plain date in the header', !$('.lg-week-date--range') && txt($('.lg-week[data-week-id="100"] .lg-week-date')) === new Date(W1 + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }));
  ok('and the meta line names the one day', txt($('.lg-hero-meta')).endsWith(' · 2 weeks · Mon'), txt($('.lg-hero-meta')));
} catch (e) { failed++; log.textContent += 'FAIL threw: ' + (e.stack || e) + '\n'; }

log.textContent += failed ? `\n${failed} FAILED` : '\nALL PASSED';
document.title = failed ? `FAIL ${failed}` : 'PASS';
</script>
</body>
</html>
