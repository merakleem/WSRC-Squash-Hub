<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RUNNING</title>
<link rel="stylesheet" href="../renderer/styles.css">
<style>#log{position:fixed;inset:0;background:#fff;color:#111;font:12px/1.5 monospace;padding:14px;overflow:auto;z-index:9999;margin:0;white-space:pre-wrap}</style>
</head>
<body>
<div class="main-wrapper" style="position:relative;min-height:100vh">
  <header class="topbar"><div class="topbar-left"><h1 id="pageTitle"></h1></div><div id="topbarActions"></div></header>
  <main class="content" id="mainContent"></main>
</div>
<div id="modalOverlay" class="modal-overlay"><div id="modal" class="modal"><div class="modal-header"><span id="modalTitle"></span><button id="modalClose" class="modal-close">&times;</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="toastContainer"></div>
<pre id="log"></pre>
<script type="module">
// The member dashboard: the six hero states in their own order, both CTA
// cards, the numbers, every schedule row type, and the feed with a ladder
// move above the match that caused it.
const log = document.getElementById('log');
let failed = 0;
const ok = (name, cond, extra = '') => {
  log.textContent += (cond ? 'PASS ' : 'FAIL ') + name + (extra !== '' ? ` [${extra}]` : '') + '\n';
  if (!cond) failed++;
};
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const txt = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');
const settle = (ms = 100) => new Promise((r) => setTimeout(r, ms));
const day = (n) => { const d = new Date(Date.now() + n * 864e5); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

const BASE = {
  id: 7, name: 'Priya Nair', photo_path: null, created_at: '2024-01-01 10:00:00',
  seasons: [{ key: '2026', name: '2026', is_current: true }],
  upcoming: [], history: [], byes: [], ladder: null,
};
let HISTORY = { ...BASE };
let DOUBLES = { history: [], upcoming: [], partners: [] };
let LADDER = { season: { key: '2026' }, system: 'elo', frozen: false, rows: [] };
let ACTIVITY = [];
let REPORTABLE = [];
let BOOKINGS = [];
let EVENTS = [];
let SLOT = null;
const nav = [];

window.fetch = async (url) => ({ ok: true, json: async () => (String(url).includes('/history') ? HISTORY : {}) });
window.api = {
  getLadderForSeason: async () => LADDER,
  getActivity: async () => ACTIVITY,
  getPlayerDoubles: async () => DOUBLES,
  getReportable: async () => REPORTABLE,
  getMyBookings: async () => BOOKINGS,
  getEvents: async () => EVENTS,
  getSuggestedSlot: async () => SLOT,
};
window.navigate = (page, params) => nav.push([page, params]);
window.openPlayerProfile = () => nav.push(['profile']);
window.openMatchCard = (id) => nav.push(['matchCard', id]);
window.openPickupGameModal = () => nav.push(['pickup']);

const { state } = await import('../renderer/state.js');
const mod = await import('../renderer/pages/dashboard.js');
const { renderDashboard, heroState, ladderGapCopy, scheduleRows, feedRows, streakOf } = mod;
state.currentUser = { role: 'player', playerId: 7, name: 'Priya Nair', is_member: 1 };
state.players = [];

const paint = async () => { await renderDashboard(); await settle(140); };

try {
  console.log('HERO STATE ORDER');
  const T = day(0);
  ok('an unscored match already played outranks everything', heroState({
    reportable: [{ id: 1, scheduled_date: day(-3) }, { id: 2, scheduled_date: day(3) }],
    upcoming: [{ id: 9, week_date: day(2) }], today: T,
  }).match.id === 1);
  ok('a fixture still to come is not a score to report', heroState({
    reportable: [{ id: 2, scheduled_date: day(3) }],
    upcoming: [{ id: 9, week_date: day(2) }], today: T,
  }).kind === 'next');
  ok('a bye in the week running now beats a fixture in a later one', heroState({
    upcoming: [{ id: 9, week_date: day(10) }],
    byes: [{ week_date: day(-1), league_id: 3, league_name: 'Box League' }], today: T,
  }).kind === 'bye');
  ok('but a fixture this week beats the bye', heroState({
    upcoming: [{ id: 9, week_date: day(2) }],
    byes: [{ week_date: day(-1), league_id: 3, league_name: 'Box League' }], today: T,
  }).kind === 'next');
  ok('with nothing scheduled, a ladder place is the card', heroState({
    ladder: { position: 12 }, ladderSize: 42, played: true, today: T,
  }).kind === 'ladder');
  ok('a member who has never played is invited to start', heroState({
    ladder: { position: null, unranked: true }, ladderSize: 42, played: false, today: T,
  }).kind === 'newcomer');
  ok('and one off the ladder who has played gets the club', heroState({
    ladder: { position: null }, ladderSize: 42, played: true,
    feed: [{ at: '2026-09-14 12:00:00', m: { winners: [{ name: 'Tom Reyes' }], losers: [{ name: 'Sam Chen' }], score: '3–1', tag: 'Ladder' } }], today: T,
  }).kind === 'club');

  console.log('\nLADDER GAP COPY');
  const rows = [{ rating: 1500 }, { rating: 1460 }, { rating: 1460 }, { rating: 1400 }];
  ok('a rated season counts the points to the place above', ladderGapCopy(rows, 2, 'elo') === '40 points away from #1.', ladderGapCopy(rows, 2, 'elo'));
  ok('level on points says so', ladderGapCopy(rows, 3, 'elo') === 'Level on points with #2.', ladderGapCopy(rows, 3, 'elo'));
  ok('the top of the ladder reads the other way', ladderGapCopy(rows, 1, 'elo') === '40 points ahead of #2.', ladderGapCopy(rows, 1, 'elo'));
  ok('a positional season has no points to count', ladderGapCopy(rows, 2, 'leapfrog') === 'One win moves you up.');

  console.log('\nSTREAK');
  ok('a run of wins is counted', JSON.stringify(streakOf([{ result: 'W' }, { result: 'W' }, { result: 'L' }])) === JSON.stringify({ result: 'W', n: 2, last: undefined }));
  ok('no played matches, no streak', streakOf([]) === null);

  console.log('\nNEXT MATCH, BOTH CTA CARDS, EVERY SCHEDULE ROW TYPE');
  HISTORY = {
    ...BASE,
    upcoming: [{ id: 30, week_date: day(2), match_time: '19:15', opponent_id: 8, opponent_name: 'Daniel Okafor', league_name: 'Box League', division_name: 'Div 2' }],
    history: [{ id: 1, result: 'W', week_date: day(-4), season_key: '2026', opponent_name: 'Ivo Thiessen' },
      { id: 2, result: 'W', week_date: day(-9), season_key: '2026', opponent_name: 'Sam Chen' },
      { id: 3, result: 'L', week_date: day(-14), season_key: '2026', opponent_name: 'Tom Reyes' }],
    ladder: { position: 7, ladder_size: 42, rank_change: 2, rating: 1460 },
  };
  DOUBLES = { history: [{ id: 50, result: 'W', played_at: day(-2) + ' 19:00:00', season_key: '2026' }], upcoming: [], partners: [] };
  LADDER = { season: { key: '2026' }, system: 'elo', frozen: false, rows: new Array(42).fill(0).map((_, i) => ({ id: i + 100, rating: 1600 - i * 10 })) };
  SLOT = { mode: 'usual', courtId: 2, courtName: 'Court 2', date: day(3), startTime: '18:00', durationMinutes: 45 };
  BOOKINGS = [
    { id: 11, courtName: 'Court 2', date: day(1), startTime: '18:00', durationMinutes: 45, bookedBy: 7, players: [{ id: 7, name: 'Priya Nair' }], typeName: null, typeColor: null, courtId: 2 },
    { id: 12, courtName: 'Court 1', date: day(3), startTime: '17:30', durationMinutes: 60, bookedBy: null, bookerName: null, players: [{ id: 7, name: 'Priya Nair' }], typeName: 'Private lesson', typeColor: '#e8a33d', courtId: 1 },
    { id: 13, courtName: 'Court 3', date: day(5), startTime: '10:00', durationMinutes: 60, bookedBy: 4, bookerName: 'Anna Lindqvist', players: [{ id: 4, name: 'Anna Lindqvist' }, { id: 7, name: 'Priya Nair' }], courtId: 3 },
  ];
  EVENTS = [
    { id: 21, name: 'Friday Social', event_date: day(4), start_time: '19:00', my_signup: { guests: 0 }, members_count: 12, spots_left: 4, full: false },
    { id: 22, name: 'Club Championship', event_date: day(12), start_time: '09:00', my_signup: null, members_count: 3, spots_left: 6, full: false },
  ];
  ACTIVITY = [
    { id: 90, confirmed_at: day(0) + ' 14:00:00', source: 'pickup', won_side: 1, player1_id: 101, player2_id: 102, eff_p1_id: 101, eff_p2_id: 102, p1_name: 'Tom Reyes', p2_name: 'Sam Chen', player1_score: 3, player2_score: 1, p1_pos: 5, p2_pos: 7, places_moved: 2, passed: [{ id: 102, name: 'Sam Chen' }, { id: 103, name: 'Ivo Thiessen' }] },
    { id: 91, confirmed_at: day(-1) + ' 19:00:00', source: 'league', format: 'doubles', won_side: 1, team1: [{ id: 104, name: 'Anna Lindqvist' }, { id: 105, name: 'Jess Wu' }], team2: [{ id: 106, name: 'Marcus Kane' }, { id: 107, name: 'Ravi Patel' }], player1_score: 3, player2_score: 2, league_name: 'Autumn Doubles', places_moved: 0, passed: [] },
    { id: 92, confirmed_at: day(-3) + ' 19:00:00', source: 'pickup', won_side: 1, player1_id: 106, player2_id: 7, eff_p1_id: 106, eff_p2_id: 7, p1_name: 'Marcus Kane', p2_name: 'Priya Nair', player1_score: 3, player2_score: 1, places_moved: 0, passed: [] },
  ];
  await paint();

  ok('the hero is the next match, with its weekday', /NEXT MATCH · /i.test(txt($('.dh-card-label'))), txt($('.dh-card-label')));
  ok('and names the opponent', txt($('.dh-card-title')) === 'Daniel Okafor', txt($('.dh-card-title')));
  ok('the countdown is running', /\d+d \d+h/.test(txt($('.dh-cd-val'))) && txt($('.dh-cd-cap')) === 'TIME UNTIL MATCH', txt($('.dh-countdown')));
  ok('with Match details and a Message button', $$('.dh-btn').map(txt).join('|') === 'Match details|Message Daniel', $$('.dh-btn').map(txt).join('|'));
  ok('Report a score is offered', !!$('.dh-report'));
  // The app's own header and hamburger belong to every page, this one included:
  // hiding the bar left the fixed hamburger floating over the hero on a phone.
  ok('the shared topbar is left alone', getComputedStyle($('.topbar')).display !== 'none');
  ok('and the page adds no header of its own', !$('.dh-page header'));
  ok('and the court card names the suggested slot', /Court 2 · \w+ 18:00/.test(txt($('.dh-court'))), txt($('.dh-court')));
  ok('the court label never changes', /BOOK A COURT/i.test(txt($('.dh-court-label'))), txt($('.dh-court-label')));

  const stats = $$('.dh-stat').map(txt);
  ok('four numbers, ladder first with its movement', /#7/.test(stats[0]) && /▲ 2/.test(stats[0]), stats.join(' | '));
  ok('the singles record is the season', /2–1/.test(stats[1]), stats[1]);
  ok('doubles too', /1–0/.test(stats[2]), stats[2]);
  ok('and the streak counts the doubles win as the newest', /W3/.test(stats[3]), stats[3]);

  ok('the schedule has no See all: there is no schedule page to go to', !$('.dh-sched .dh-block-link'));
  ok('but the feed keeps its link to the full one', txt($('.dh-feed .dh-block-link')) === 'All activity');
  const rowsEls = $$('.dh-sched-row');
  ok('six rows: bookings, the fixture and the events, in time order', rowsEls.length === 6, String(rowsEls.length));
  ok('a solo booking says so and offers Manage', /Solo booking/.test(txt(rowsEls[0])) && /Manage/.test(txt(rowsEls[0])), txt(rowsEls[0]));
  ok('the fixture is a row of its own', /Your match · Daniel Okafor · 19:15/.test(txt(rowsEls[1])), txt(rowsEls[1]));
  ok("a club booking names the club and carries its type tag", /Booked by the club/.test(txt(rowsEls[2])) && txt(rowsEls[2].querySelector('.dh-sched-tag')) === 'Private lesson', txt(rowsEls[2]));
  ok('an event you are going to shows the tag, not a button', /You and 11 others are going/.test(txt(rowsEls[3])) && !!rowsEls[3].querySelector('.dh-sched-going'), txt(rowsEls[3]));
  ok("a booking someone else made names them", /Anna Lindqvist booked · with you/.test(txt(rowsEls[4])), txt(rowsEls[4]));
  ok('an event still open shows the spots and a Join button', /6 spots open/.test(txt(rowsEls[5])) && !!rowsEls[5].querySelector('.dh-sched-join'), txt(rowsEls[5]));

  const feed = $$('.dh-feed-row');
  ok('the ladder move sits directly above the match that caused it', feed[0].classList.contains('dh-feed-row--move') && /Tom Reyes passes Sam Chen & Ivo Thiessen/.test(txt(feed[0])), txt(feed[0]));
  ok('with the number of places gained', /▲ 2/.test(txt(feed[0])), txt(feed[0]));
  ok('then the result itself', /Tom Reyes beat Sam Chen/.test(txt(feed[1])) && /3–1/.test(txt(feed[1])), txt(feed[1]));
  ok('a doubles result names both pairs and is tagged', /A\. Lindqvist & J\. Wu beat M\. Kane & R\. Patel/.test(txt(feed[2])) && /doubles/.test(txt(feed[2])), txt(feed[2]));
  ok('your own loss reads as yours, in grey', /Marcus Kane beat you/.test(txt(feed[3])) && feed[3].querySelector('.dh-feed-score--lost'), txt(feed[3]));

  console.log('\nA SCORE STILL OWED');
  REPORTABLE = [{ id: 44, type: 'ladder', format: 'singles', scheduled_date: day(-4), opponent_name: 'Marcus Kane', opponent_photo: null }];
  await paint();
  ok('outranks the next match', /SCORE TO REPORT/i.test(txt($('.dh-card-label'))), txt($('.dh-card-label')));
  ok('naming who, and that nothing is entered', txt($('.dh-card-title')) === 'Marcus Kane' && /Ladder match · no score entered yet/.test(txt($('.dh-card-sub'))), txt($('.dh-card-sub')));
  ok('with a face beside it', !!$('.dh-face'));
  $$('.dh-btn')[0].click();
  ok('Report score opens that match', JSON.stringify(nav[nav.length - 1]) === JSON.stringify(['reportScore', { matchId: 44 }]), JSON.stringify(nav[nav.length - 1]));
  REPORTABLE = [];

  console.log('\nA BYE WEEK');
  HISTORY = { ...HISTORY, upcoming: [{ id: 31, week_date: day(9), match_time: '19:15', opponent_id: 8, opponent_name: 'Daniel Okafor', league_name: 'Box League' }], byes: [{ week_date: day(-1), week_number: 4, league_id: 3, league_name: 'Box League' }] };
  await paint();
  ok('says there is no match this week', txt($('.dh-card-title')) === 'No match this week', txt($('.dh-card-title')));
  ok('names the league it is a bye in', /BYE THIS WEEK · BOX LEAGUE/i.test(txt($('.dh-card-label'))), txt($('.dh-card-label')));
  ok('and points at the next fixture', /Next up · Daniel Okafor/.test(txt($('.dh-card-sub'))), txt($('.dh-card-sub')));

  console.log('\nON THE LADDER, NOTHING SCHEDULED');
  HISTORY = { ...HISTORY, upcoming: [], byes: [], ladder: { position: 12, ladder_size: 42, rank_change: 0 } };
  LADDER = { season: { key: '2026' }, system: 'elo', frozen: false, rows: new Array(42).fill(0).map((_, i) => ({ id: i + 100, rating: 1600 - i * 10 })) };
  await paint();
  ok('the card is the ladder', txt($('.dh-card-title')) === 'Keep climbing', txt($('.dh-card-title')));
  ok('with a ring reading the place', /#12/.test(txt($('.dh-ring-in'))) && /OF 42/.test(txt($('.dh-ring-in'))), txt($('.dh-ring-in')));
  ok('and how far the next place is', /10 points away from #11\./.test(txt($('.dh-card-sub'))), txt($('.dh-card-sub')));
  ok('offering a match and a player to play', $$('.dh-btn').map(txt).join('|') === 'Enter a match|Find a player', $$('.dh-btn').map(txt).join('|'));

  console.log('\nA BRAND-NEW MEMBER');
  HISTORY = { ...BASE, created_at: new Date().toISOString().slice(0, 19).replace('T', ' '), ladder: { position: null, unranked: true, ladder_size: 0 } };
  DOUBLES = { history: [], upcoming: [], partners: [] };
  BOOKINGS = []; SLOT = { mode: 'open', courtId: 1, courtName: 'Court 1', date: day(0), startTime: '18:00', durationMinutes: 30 };
  await paint();
  ok('is welcomed rather than greeted', /^Welcome, Priya/.test(txt($('.dh-greet-line'))), txt($('.dh-greet-line')));
  ok('and pushed to start climbing', txt($('.dh-card-title')) === 'Start your climb', txt($('.dh-card-title')));
  ok('with one sentence, not a pep talk', txt($('.dh-card-sub')) === 'One match is all it takes to get your spot.', txt($('.dh-card-sub')));
  ok('there is nothing to report a score for yet', !$('.dh-report'));
  ok('but a court to book, named for today', /Court 1 · today 18:00/.test(txt($('.dh-court'))), txt($('.dh-court')));
  ok('the numbers are a placeholder, not zeroes', !$('.dh-stats') && /after your first match/.test(txt($('.dh-stats-empty'))), txt($('.dh-stats-empty')));
  ok('the schedule still lists the events they could join', $$('.dh-sched-join').length === 1, String($$('.dh-sched-join').length));

  console.log('\nA PLAYER WHO IS NOT A CLUB MEMBER');
  state.currentUser = { role: 'player', playerId: 7, name: 'Priya Nair', is_member: 0 };
  window.api.getMyBookings = async () => { throw new Error('members only'); };
  window.api.getSuggestedSlot = async () => { throw new Error('members only'); };
  await paint();
  ok('is never offered a court', !$('.dh-court'));
  ok('and no row on the schedule hints at what they cannot see', !/member/i.test(txt($('.dh-sched'))), txt($('.dh-sched')));
} catch (e) {
  failed++;
  log.textContent += 'THREW ' + e.message + '\n' + (e.stack || '').split('\n').slice(0, 5).join('\n') + '\n';
}
log.textContent += failed ? `\n${failed} FAILED` : '\nALL PASSED';
document.title = failed ? `FAIL ${failed}` : 'PASS';
</script>
</body>
</html>
