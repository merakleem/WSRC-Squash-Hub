<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RUNNING</title>
<link rel="stylesheet" href="../renderer/styles.css">
<style>#log{position:fixed;inset:0;background:#fff;color:#111;font:12px/1.5 monospace;padding:14px;overflow:auto;z-index:9999;margin:0;white-space:pre-wrap}</style>
</head>
<body>
<div class="app-container"><div class="main-wrapper" style="position:relative">
  <header class="topbar"><h1 class="topbar-title" id="pageTitle"></h1><div id="topbarActions"></div></header>
  <main class="content" id="mainContent" style="flex:0 0 600px;height:600px;overflow:auto"></main>
</div></div>
<div id="modalOverlay" class="modal-overlay"><div id="modal" class="modal"><div class="modal-header"><span id="modalTitle"></span><button id="modalClose" class="modal-close">&times;</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="toastContainer"></div>
<pre id="log"></pre>
<script type="module">
// The ladder page with its Singles / Doubles tabs, and the doubles variant
// of the enter-a-match modal, driven against a stubbed API.
const log = document.getElementById('log');
let failed = 0;
const ok = (name, cond, extra = '') => {
  log.textContent += (cond ? 'PASS ' : 'FAIL ') + name + (extra !== '' ? ` [${extra}]` : '') + '\n';
  if (!cond) failed++;
};
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const click = (el) => el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
const type = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); };
const settle = (ms = 60) => new Promise((r) => setTimeout(r, ms));

const P = [[1, 'Sofia Duarte'], [2, 'Marcus Bell'], [3, 'Priya Nair'], [4, 'Tom Ashworth'], [5, 'Elena Kovac'], [7, 'Hannah Reid']]
  .map(([id, name]) => ({ id, name, photo_path: null, club_locker_rating: 3.5, exclude_from_ladder: 0 }));
const row = (id, position, rating, w, l, change = 0) => ({ ...P.find((p) => p.id === id), position, rating, season_wins: w, season_losses: l, rank_change: change, matches_played: w + l, unranked: false });
const SEASON = { id: '2026', key: '2026', name: '2026', is_current: true, start_date: '2026-01-01', end_date: '2026-12-31', ladder_system: 'elo' };
const SINGLES = { season: SEASON, system: 'elo', frozen: false, rows: [row(1, 1, 1620, 14, 3), row(2, 2, 1588, 12, 4), row(7, 3, 1498, 8, 6, 1), row(3, 4, 1471, 5, 5)] };
const DOUBLES = { season: SEASON, system: 'elo', frozen: false, rows: [row(4, 1, 1102, 5, 1, 2), row(7, 2, 1080, 4, 2), row(1, 3, 1010, 3, 3, -1)] };
const calls = [];
window.api = {
  getLadderForSeason: async (s) => { calls.push(['singles', s]); return SINGLES; },
  getDoublesLadderForSeason: async (s) => { calls.push(['doubles', s]); return DOUBLES; },
  getPlayerRecords: async () => [],
  getSeasons: async () => [SEASON],
  getPlayers: async () => P,
  logDoublesMatch: async (d) => { calls.push(['log', d]); return { ok: true, id: 9 }; },
  logPickupGame: async (d) => { calls.push(['logSingles', d]); return { ok: true }; },
};
window.navigate = () => {};
const { state } = await import('../renderer/state.js');
state.currentUser = { role: 'user', playerId: 7, name: 'Hannah Reid' };
state.players = P;
state.page = 'ladder';
const players = await import('../renderer/pages/players.js');
const { renderLadder } = await import('../renderer/pages/ladder.js');
window.renderLadder = renderLadder;

try {
  await renderLadder(); await settle(120);
  console.log; log.textContent += 'THE TABS\n';
  ok('the top bar carries Singles and Doubles tabs beside the title', $$('.ldr-mode-tab').map((t) => t.textContent).join('|') === 'Singles|Doubles' && $('#pageTitle').contains($('.ldr-mode-tabs')));
  ok('Singles is on by default and the singles ladder is loaded', $('.ldr-mode-tab--on').textContent === 'Singles' && calls[0][0] === 'singles' && $$('.ldr-all-row').length === 4);
  ok('the rating column shows on the singles ladder', $$('.ldr-all-row')[0].querySelector('.ldr-col-rating')?.textContent === '1620');
  type($('#ldrSearch'), 'sofia'); await settle(200);
  ok('search narrows the singles list', $$('.ldr-all-row').length === 1);

  click($$('.ldr-mode-tab')[1]); await settle(150);
  ok('Doubles loads the doubles ladder', $('.ldr-mode-tab--on').textContent === 'Doubles' && calls.some((c) => c[0] === 'doubles'));
  ok('and the search is cleared', $('#ldrSearch').value === '' && $$('.ldr-all-row').length === 3, `${$('#ldrSearch').value}|${$$('.ldr-all-row').length}`);
  ok('rows rank by doubles rating with the rating column', $$('.ldr-all-row .ldr-col-rating').map((c) => c.textContent).join() === '1102,1080,1010');
  ok('the count reads three players', $('#ldrCount').textContent === '3 players', $('#ldrCount').textContent);
  ok('my row is marked and the self bar offers a jump', !!$('.ldr-all-me') && /Hannah Reid/.test($('.ldr-all-me').textContent) && !!$('#ldrJumpMe'));
  ok('W/L are the season doubles record', $('.ldr-all-me .ldr-col-won').textContent === '4' && $('.ldr-all-me .ldr-col-lost').textContent === '2');
  ok('movement badge shows places moved', $$('.ldr-all-row')[0].querySelector('.ldr-change-up')?.textContent.trim() === '2');
  click($('#btnLadderInfo')); await settle();
  ok('the info bubble explains the doubles ladder', $('#modalTitle').textContent === 'How the Doubles Ladder Works' && /all four players/.test($('#modalBody').textContent));
  click($('#modalClose')); await settle();

  log.textContent += '\nENTER A DOUBLES MATCH\n';
  click($('#ldrEnterMatch')); await settle(150);
  ok('the FAB opens the doubles modal with its chip', /Enter a doubles match/.test($('#modalTitle').textContent) && $('#modalTitle .em-mode-chip')?.textContent === 'Doubles', $('#modalTitle').textContent);
  ok('your team: you as a fixed row plus a teammate field', $('.em-self-name')?.textContent === 'Hannah Reid' && $('#dmP1bSearch')?.placeholder === 'Search teammate…');
  ok('opponents: two fields', $('#dmP2Search')?.placeholder === 'Search opponent…' && !!$('#dmP2bSearch'));
  ok('group labels read Your team and Opponents', $$('.em-label').slice(0, 2).map((l) => l.textContent).join('|') === 'Your team|Opponents');
  ok('winner cards wait for all four', $$('.em-winner-card').every((c) => c.disabled) && $('#emWinnerHint').textContent === 'Pick your teammate and both opponents first');
  const pick = async (slot, name) => {
    const input = $(`#${slot}Search`); input.focus(); input.dispatchEvent(new Event('focus')); await settle();
    const opt = $$(`#${slot}List .pu-search-option`).find((o) => o.dataset.name === name);
    if (!opt) throw new Error(`${name} not offered for ${slot}: ` + $$(`#${slot}List .pu-search-option`).map((o) => o.dataset.name).join());
    opt.dispatchEvent(new MouseEvent('mousedown', { bubbles: true })); await settle();
  };
  $('#dmP1bSearch').focus(); $('#dmP1bSearch').dispatchEvent(new Event('focus')); await settle();
  ok('suggestions show the doubles rank and exclude you', $$('#dmP1bList .pu-search-option').every((o) => o.dataset.name !== 'Hannah Reid') && $$('#dmP1bList .pu-search-option').find((o) => o.dataset.name === 'Tom Ashworth')?.querySelector('.em-opt-rank').textContent === '#1');
  ok('an unranked player shows no rank', $$('#dmP1bList .pu-search-option').find((o) => o.dataset.name === 'Marcus Bell')?.querySelector('.em-opt-rank').textContent === '');
  ok('at most five suggestions', $$('#dmP1bList .pu-search-option').length <= 5);
  await pick('dmP1b', 'Tom Ashworth');
  $('#dmP2Search').focus(); $('#dmP2Search').dispatchEvent(new Event('focus')); await settle();
  ok('a player already picked is not offered elsewhere', !$$('#dmP2List .pu-search-option').some((o) => o.dataset.name === 'Tom Ashworth'));
  await pick('dmP2', 'Sofia Duarte');
  await pick('dmP2b', 'Priya Nair');
  ok('with all four chosen the side cards read You & teammate vs the pair', $$('.em-winner-card').every((c) => !c.disabled) && $$('.em-winner-name').map((n) => n.textContent).join('|') === 'You & Tom Ashworth|Sofia Duarte & Priya Nair', $$('.em-winner-name').map((n) => n.textContent).join('|'));
  ok('each side card stacks two avatars', $$('.em-winner-card').every((c) => c.querySelectorAll('.em-winner-avatar').length === 2));
  click($$('.em-winner-card')[0]); await settle();
  ok('picking the winner shows the games with the pair hint', !$('#emGamesSection').hidden && $('#emGamesHint').textContent === 'Winning pair’s games first', $('#emGamesHint').textContent);
  click($$('.em-games-card')[1]); await settle();
  ok('the summary names both pairs', $('.em-confirm-text')?.textContent === 'Hannah Reid & Tom Ashworth beat Sofia Duarte & Priya Nair 3–1', $('.em-confirm-text')?.textContent);
  ok('and Log match is enabled', !$('#puSubmit').disabled);
  click($('#puSubmit')); await settle(200);
  const logged = calls.find((c) => c[0] === 'log');
  ok('submit posts the two teams and the score', logged && logged[1].team1.join() === '7,4' && logged[1].team2.join() === '1,3' && logged[1].team1Score === 3 && logged[1].team2Score === 1 && !('playedOn' in logged[1]), JSON.stringify(logged?.[1]));
  ok('with a doubles toast', /Doubles match recorded/.test($('#toastContainer').textContent));
  ok('and the ladder is re-fetched', calls.filter((c) => c[0] === 'doubles').length >= 2);

  log.textContent += '\nADMIN + SINGLES UNCHANGED\n';
  state.currentUser = { role: 'admin', playerId: null };
  await players.openPickupGameModal({ mode: 'doubles' }); await settle(150);
  ok('an admin gets a Player 1 field instead of the fixed row', !$('.em-self-card') && !!$('#dmP1Search') && $('#emWinnerHint').textContent === 'Choose all four players first');
  click($('#emCancel')); await settle();
  await players.openPickupGameModal(); await settle(150);
  ok('the singles modal keeps its title and gains the Singles chip', /Enter a match/.test($('#modalTitle').textContent) && $('#modalTitle .em-mode-chip')?.textContent === 'Singles' && !!$('#puP1Search'));
  click($('#emCancel')); await settle();
} catch (e) {
  failed++;
  log.textContent += 'THREW ' + e.message + '\n' + (e.stack || '').split('\n').slice(0, 4).join('\n') + '\n';
}
log.textContent += failed ? `\n${failed} FAILED` : '\nALL PASSED';
document.title = failed ? `FAIL ${failed}` : 'PASS';
</script>
</body>
</html>
