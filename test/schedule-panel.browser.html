<!-- Drives the real schedule + panel modules in a browser and asserts the
     behaviour this page describes. Serve the repo root and open
     /test/schedule-panel.browser.html - the title becomes PASS or FAIL. -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../renderer/styles.css">
<style>html,body{margin:0;height:100%}.app-container{display:flex;height:100%}.sidebar{width:220px;flex:none}
.main-wrapper{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{height:60px;display:flex;align-items:center;padding:0 26px;flex:none}
.topbar-actions{margin-left:auto;display:flex;gap:12px}.content{flex:1;min-height:0}</style></head>
<body><div class="app-container"><aside class="sidebar"></aside><div class="main-wrapper">
<header class="topbar"><h1 id="pageTitle"></h1><div class="topbar-actions" id="topbarActions"></div></header>
<main class="content" id="mainContent"></main></div></div>
<div id="modalOverlay" style="display:none"><div id="modal"><div id="modalTitle"></div><div id="modalBody"></div><button id="modalClose"></button></div></div>
<div id="toastContainer"></div><pre id="log" style="position:fixed;inset:0;background:#fff;z-index:999;font:12px monospace;padding:12px;white-space:pre-wrap"></pre>
<script type="module">
const out=[]; let fails=0;
const ok=(name,cond,extra='')=>{ if(!cond) fails++; out.push((cond?'  PASS  ':'  FAIL  ')+name+(extra?'  ['+extra+']':'')); };
try {
const payload = await (await fetch('schedule-payload.json')).json();
const PLAYERS = ['Sofia Duarte','Marcus Lang','Priya Raman','Tom Beckett','Elena Sorokin','Dev Patel','Ruth Okonjo','Callum Reid','James Whitfield'].map((name,i)=>({id:i+1,name}));
const calls=[];
window.api = { getSchedule:async()=>payload, getCourts:async()=>payload.courts,
  getBookingTypes:async()=>payload.types, getPlayers:async()=>PLAYERS,
  addBooking:async(d)=>{calls.push(['addBooking',d]); return {id:999};},
  addRepeatBookings:async(d)=>{calls.push(['addRepeatBookings',d]); return {created:8,skipped:0};},
  updateBooking:async(id,d)=>{calls.push(['updateBooking',id,d]); return {};},
  deleteBooking:async(id,o)=>{calls.push(['deleteBooking',id,o]); return {};} };
window.openMatchCard=()=>{}; window.navigate=()=>{};
const { state } = await import('../renderer/state.js');
state.currentUser={role:'admin',playerId:null}; state.scheduleDate='2026-08-12';
const sched = await import('../renderer/schedule.js');
const panel = await import('../renderer/schedulePanel.js');
await sched.renderSchedule();
await new Promise(r=>setTimeout(r,80));

const $=(s)=>document.querySelector(s), $$=(s)=>[...document.querySelectorAll(s)];
const click=(el)=>el.dispatchEvent(new MouseEvent('click',{bubbles:true}));
const tick=()=>new Promise(r=>setTimeout(r,20));

// ---- grid ----
ok('per-slot hover cells are gone', $$('.sch-slot').length===0);
ok('legend has no booking count', $$('.sch-legend-count').length===0);
ok('helper copy mentions 15 minutes', $('.sch-topbar-help').textContent.includes('snaps to 15 minutes'));
ok('snap line exists with a pill', !!$('.sch-hover-line .sch-hover-pill'));
ok('15-min block uses the short layout', $$('.sch-booking--short').length===1);
ok('repeating blocks show the repeat glyph', $$('.sch-booking-repeat').length===3, $$('.sch-booking-repeat').length);
ok('header row is bordered top and bottom',
   getComputedStyle($('.sch-grid-header')).borderTopWidth==='1px' && getComputedStyle($('.sch-grid-header')).borderBottomWidth==='1px');
ok('legend is pinned with the court names', !!$('.sch-grid-sticky .sch-legend'));

// ---- panel: new ----
await panel.openBookingPanel({ mode:'new', host:$('.sch-page'), courts:payload.courts,
  slots:payload.slots, types:payload.types, players:PLAYERS, courtIds:[2], start:14*60, dur:60 });
await tick();
ok('panel opens with two steps', $$('.sch-panel-step').length===2);
ok('primary reads Add booking', $('#schPanelPrimary').textContent==='Add booking');
ok('duration shows 1h', $$('.sch-step-val')[1].textContent==='1h');

// 15-minute steppers
click($$('[data-act="dur+"]')[0]); await tick();
ok('duration steps by 15 minutes', $$('.sch-step-val')[1].textContent==='1h 15m', $$('.sch-step-val')[1].textContent);
click($$('[data-act="start-"]')[0]); await tick();
ok('start steps back by 15 minutes', $$('.sch-step-val')[0].textContent==='1:45 PM', $$('.sch-step-val')[0].textContent);

// multi-court
click($$('[data-court]')[2]); await tick();
ok('a second court chip selects', $$('.sch-chip.is-on').length===2);
ok('title counts the courts', $('.sch-panel-title').textContent==='2 courts');

// type
click($$('[data-type]')[3]); await tick();
ok('a type chip selects', $$('.sch-tchip.is-on').length===1);

// players
$('#schPanelSearch').value='sof';
$('#schPanelSearch').dispatchEvent(new Event('input',{bubbles:true})); await tick();
ok('search finds a player', $$('.sch-search-row').length===1, $$('.sch-search-row').length);
$('.sch-search-row').dispatchEvent(new MouseEvent('mousedown',{bubbles:true})); await tick();
ok('picking a player makes a chip', $$('.sch-pchip').length===1);
ok('the free counter drops', $('.sch-panel-room').textContent==='3 of 4 free');

// repeat step
click($$('.sch-panel-step')[1]); await tick();
ok('step 2 shows the day pills', $$('.sch-dow').length===7);
ok('today’s weekday is preselected', $$('.sch-dow.is-on').length===1);
ok('primary becomes Add bookings', $('#schPanelPrimary').textContent==='Add bookings');
ok('hint counts the events', $('.sch-panel-hint').textContent==='Creates 4 events.', $('.sch-panel-hint').textContent);
click($$('[data-act="indef"]')[0]); await tick();
ok('indefinite changes the hint', $('.sch-panel-hint').textContent.startsWith('Creates a year'));
click($$('[data-act="indef"]')[0]); await tick();

// submit the repeat
click($('#schPanelPrimary')); await new Promise(r=>setTimeout(r,120));
const rep = calls.find(c=>c[0]==='addRepeatBookings');
ok('repeat posts to addRepeatBookings', !!rep);
ok('repeat sends both courts', rep && JSON.stringify(rep[1].courtIds)==='[2,3]', rep&&JSON.stringify(rep[1].courtIds));
ok('repeat sends a 15-min-aligned start', rep && rep[1].startTime==='13:45', rep&&rep[1].startTime);
ok('repeat sends 75 minutes', rep && rep[1].durationMinutes===75, rep&&rep[1].durationMinutes);
ok('repeat carries the chosen player', rep && rep[1].playerIds.length===1);
ok('repeat carries days + weeks', rep && rep[1].repeat.daysOfWeek.length===1 && rep[1].repeat.weeks===4);
ok('panel closed after submit', !panel.isBookingPanelOpen());

// ---- a plain single booking, end to end ----
// The path that matters most, and the one a repeat-only test misses: it is the
// only branch that used to read panel state after closing the panel.
let doneFired = 0;
const errs = () => $$('#toastContainer .toast.error').length;
const errsBefore = errs();
await panel.openBookingPanel({ mode:'new', host:$('.sch-page'), courts:payload.courts,
  slots:payload.slots, types:payload.types, players:PLAYERS, courtIds:[4], start:11*60, dur:60,
  onDone:()=>{doneFired++;} });
await tick();
click($('#schPanelPrimary')); await new Promise(r=>setTimeout(r,150));
const add = calls.find(c=>c[0]==='addBooking');
ok('a plain booking posts to addBooking', !!add);
ok('a plain booking sends one court', add && add[1].courtId===4 && add[1].courtIds===null);
ok('a plain booking closes the panel', !panel.isBookingPanelOpen());
ok('a plain booking tells the grid to refresh', doneFired===1, doneFired);
ok('a plain booking raises no error', errs()===errsBefore, errs()-errsBefore);

// ---- an edit, end to end ----
let editDone = 0;
const errsBefore2 = errs();
await panel.openBookingPanel({ mode:'edit', host:$('.sch-page'), courts:payload.courts,
  slots:payload.slots, types:payload.types, players:PLAYERS,
  slot:payload.slots.find(s=>s.id===7), onDone:()=>{editDone++;} });
await tick();
click($$('[data-act="dur+"]')[0]); await tick();
click($('#schPanelPrimary')); await new Promise(r=>setTimeout(r,150));
const upd = calls.find(c=>c[0]==='updateBooking');
ok('an edit posts to updateBooking', !!upd);
ok('an edit sends the edited id', upd && upd[1]===7, upd&&upd[1]);
ok('an edit sends the new duration', upd && upd[2].durationMinutes===105, upd&&upd[2].durationMinutes);
ok('an edit tells the grid to refresh', editDone===1, editDone);
ok('an edit raises no error', errs()===errsBefore2, errs()-errsBefore2);

// ---- panel: edit ----
const editSlot = payload.slots.find(s=>s.id===3);   // a repeating one
await panel.openBookingPanel({ mode:'edit', host:$('.sch-page'), courts:payload.courts,
  slots:payload.slots, types:payload.types, players:PLAYERS, slot:editSlot });
await tick();
ok('edit mode has no steps', $$('.sch-panel-step').length===0);
ok('edit primary reads Save changes', $('#schPanelPrimary').textContent==='Save changes');
ok('edit offers delete', !!$('#schPanelDelete'));
ok('edit prefills the label', $('#schPanelName').value==='League · Div 2');
click($('#schPanelDelete')); await tick();
ok('a repeating booking asks for a scope', $$('.sch-del-scopes .sch-del-btn').length===3);
click($$('[data-del]')[1]); await new Promise(r=>setTimeout(r,120));
const del = calls.find(c=>c[0]==='deleteBooking');
ok('delete sends the future scope', del && del[2] && del[2].scope==='future', del&&JSON.stringify(del[2]));

// ---- adjacency is a hard stop, unlike overlap ----
await panel.openBookingPanel({ mode:'new', host:$('.sch-page'), courts:payload.courts,
  slots:payload.slots, types:payload.types, players:PLAYERS, courtIds:[1], start:14*60, dur:60 });
await tick();
ok('one court is fine', !$('.sch-panel-block') && !$('#schPanelPrimary').disabled);
click($$('[data-court]')[2]); await tick();   // add Court 3 -> 1 and 3, not adjacent
ok('a scattered pick is called out', !!$('.sch-panel-block'));
ok('a scattered pick stops the save', $('#schPanelPrimary').disabled);
click($$('[data-court]')[1]); await tick();   // add Court 2 -> 1,2,3 contiguous
ok('filling the gap clears the block', !$('.sch-panel-block') && !$('#schPanelPrimary').disabled);
click($$('[data-court]')[0]); click($$('[data-court]')[1]); click($$('[data-court]')[2]); await tick();
ok('no court at all stops the save', $('#schPanelPrimary').disabled);
panel.closeBookingPanel(); await tick();

// ---- overlap warning ----
await panel.openBookingPanel({ mode:'new', host:$('.sch-page'), courts:payload.courts,
  slots:payload.slots, types:payload.types, players:PLAYERS, courtIds:[2,3], start:19*60, dur:90 });
await tick();
ok('overlap is warned about', $('.sch-panel-warn')?.textContent==='Overlaps 2 existing bookings', $('.sch-panel-warn')?.textContent);
ok('overlap warns but does not block', !$('#schPanelPrimary').disabled);
panel.closeBookingPanel(); await tick();

// ---- the real gesture: a plain click on empty grid ----
const row=$('.sch-courts-row'), cols=$$('.sch-court-col');
const yFor=(m)=>row.getBoundingClientRect().top+((m-360)/30)*38;
const mev=(t,x,y,el)=>(el||row).dispatchEvent(new MouseEvent(t,{bubbles:true,clientX:x,clientY:y,button:0}));
const cx=cols[0].getBoundingClientRect().left+60, cy=yFor(14*60+22);
mev('mousedown',cx,cy,cols[0]); mev('mouseup',cx,cy);
await new Promise(r=>setTimeout(r,150));
ok('a plain click opens the panel', panel.isBookingPanelOpen());
ok('click books one hour', $$('.sch-step-val')[1]?.textContent==='1h', $$('.sch-step-val')[1]?.textContent);
ok('click starts at the snapped quarter hour', $$('.sch-step-val')[0]?.textContent==='2:15 PM', $$('.sch-step-val')[0]?.textContent);
ok('click preselects the hovered court', $$('.sch-chip.is-on').length===1 && $$('.sch-chip.is-on')[0].textContent==='Court 1');
ok('pending range is drawn on the grid', $$('.sch-ghost').length===1, $$('.sch-ghost').length);
click($$('[data-court]')[1]); await tick();
ok('adding a court adds a ghost', $$('.sch-ghost').length===2, $$('.sch-ghost').length);
click($$('[data-act="dur+"]')[0]); await tick();
ok('the ghost label follows the stepper',
   $('.sch-ghost-label').textContent==='2:15–3:30 PM · 1h 15m', $('.sch-ghost-label').textContent);
panel.closeBookingPanel(); await tick();
ok('closing clears the ghosts', $$('.sch-ghost').length===0);
} catch (e) { fails++; out.push('  THREW  '+e.message+'\n'+e.stack); }
document.getElementById('log').textContent = out.join('\n')+'\n\n'+(fails? fails+' FAILED':'ALL '+out.length+' PASSED');
document.title = fails? 'FAIL' : 'PASS';
</script></body></html>
