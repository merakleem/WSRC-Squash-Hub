<!-- Drives the real Events page module in a browser and asserts the handoff's
     behaviour for both roles. Serve the repo root and open
     /test/events.browser.html - the title becomes PASS or FAIL. -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../renderer/styles.css"></head>
<body><div class="app-container"><aside class="sidebar" style="width:220px"></aside><div class="main-wrapper">
<header class="topbar"><h1 id="pageTitle"></h1><div class="topbar-actions" id="topbarActions"></div></header>
<main class="content" id="mainContent"></main></div></div>
<div id="modalOverlay" style="display:none"><div id="modal"><div id="modalTitle"></div><div id="modalBody"></div><button id="modalClose"></button></div></div>
<div id="toastContainer"></div>
<pre id="log" style="position:fixed;inset:0;background:#fff;z-index:999;font:12px monospace;padding:12px;white-space:pre-wrap;overflow:auto"></pre>
<script type="module">
const out=[]; let fails=0;
const ok=(n,c,x='')=>{ if(!c) fails++; out.push((c?'  PASS  ':'  FAIL  ')+n+(x!==''?'  ['+x+']':'')); };
try {
const { EVENTS, DETAILS } = await import('./events-fixture.js');
const calls=[];
window.api = {
  getEvents: async (scope) => JSON.parse(JSON.stringify(EVENTS[scope||'upcoming'])),
  getEvent: async (id) => JSON.parse(JSON.stringify(DETAILS[id])),
  createEvent: async (d) => { calls.push(['createEvent', d]); return { id: 99, ...d }; },
  updateEvent: async (id, d) => { calls.push(['updateEvent', id, d]); return { id, ...d }; },
  deleteEvent: async (id) => { calls.push(['deleteEvent', id]); return { ok: true }; },
  signUpForEvent: async (id, d) => { calls.push(['signUp', id, d]); return { ok: true }; },
  updateEventSignup: async (id, d) => { calls.push(['updateSignup', id, d]); return { ok: true }; },
  withdrawFromEvent: async (id) => { calls.push(['withdraw', id]); return { ok: true }; },
  removeEventAttendee: async (id, pid) => { calls.push(['removeAttendee', id, pid]); return { ok: true }; },
  searchLinkables: async (q) => [{type:'league',id:4,name:'Winter League 2027',meta:'Registration open'},{type:'tournament',id:9,name:'Club Championships 2026',meta:'3 Oct 2026'}].filter(l=>l.name.toLowerCase().includes(q.toLowerCase())),
};
let navved=null;
window.navigate = (p, prm) => { navved=[p, prm]; };
const { state } = await import('../renderer/state.js');
const { renderEvents } = await import('../renderer/pages/events.js');
const $=(s)=>document.querySelector(s), $$=(s)=>[...document.querySelectorAll(s)];
const tick=(ms=140)=>new Promise(r=>setTimeout(r,ms));
const text=(s)=>$(s)?.textContent.trim();

// ================= PLAYER =================
state.currentUser = { role:'user', playerId:42 };
renderEvents(); await tick(200);

ok('count line reads upcoming', text('.ev-count')==='4 upcoming', text('.ev-count'));
ok('players get no New event button', !$('#evNew'));
ok('months group the list', $$('.ev-month').map(m=>m.textContent).join('|')==='September 2026|October 2026|December 2026', $$('.ev-month').map(m=>m.textContent).join('|'));
const cards=$$('.ev-card');
ok('pills follow priority', cards[0].querySelector('.pill').textContent==='Open' && cards[1].querySelector('.pill').textContent==='Full' && cards[2].querySelector('.pill').textContent==='Signed up');
ok('type chips on linked events', cards[1].querySelector('.chip')?.textContent==='tournament' && cards[3].querySelector('.chip')?.textContent==='league');
ok('league-linked counts say registered', cards[3].textContent.includes('9 registered'));
ok('past-free spots lines', cards[0].textContent.includes('13 spots left') && cards[1].textContent.includes('32 of 32') && cards[2].textContent.includes('No limit'));
ok('ME leads the stack when signed up', cards[2].querySelector('.ev-av').textContent==='ME');
ok('date line omits missing time', cards[3].textContent.includes('Tue 1 Dec') && !cards[3].textContent.includes('· null'));
ok('first event selected with hero', text('.ev-hero-name')==='Back to the Bunker' && $('.ev-card--sel')===cards[0]);
ok('facts read the capacity', text('.ev-facts-cap')==='13 spots left of 40' && text('.ev-facts-n')==='27');
ok('progress bar shows for capped events', !!$('.ev-bar'));

// sign-up flow with a guest
$('#evGuestUp').click(); await tick(50);
ok('pending guest changes the button', text('#evSignUp')==='Sign up · you + 1', text('#evSignUp'));
$('#evSignUp').click(); await tick(250);
const su=calls.find(c=>c[0]==='signUp');
ok('sign up posts the chosen guests', su && su[1]===1 && su[2].guests===1, su&&JSON.stringify(su));

// signed-up event: stepper caps at the guest limit, withdraw works
$$('.ev-card')[2].click(); await tick(250);
ok('signed action card is green', !!$('.ev-action--in') && text('.ev-signed-title')==="You're signed up");
ok('signed line counts the guest', text('.ev-signed-sub')==='You + 1 guest');
ok('the + locks at the guest limit', $('#evGuestUp').disabled);
ok('roster names me You, first', $$('.ev-row')[0].classList.contains('ev-row--me') && $$('.ev-row')[0].textContent.includes('You'));
ok('players see no member numbers', !$('.ev-row-no'));
ok('players see no remove buttons', !$('.ev-row-x'));
ok('long rosters truncate to six', $$('.ev-row').length===6 && text('#evRosterToggle')==='Show all 15', text('#evRosterToggle'));
$('#evRosterToggle').click(); await tick(60);
ok('show all expands', $$('.ev-row').length===15 && text('#evRosterToggle')==='Show fewer');
$('#evWithdraw').click(); await tick(250);
ok('withdraw calls the API', calls.some(c=>c[0]==='withdraw' && c[1]===3));

// full event locks the button
$$('.ev-card')[1].click(); await tick(250);
ok('full event locks sign up', $('#evSignUp')?.disabled && text('#evSignUp')==='Event is full');
ok('full bar goes grey', !!$('.ev-bar-fill--full'));

// linked event: go-to button navigates
$$('.ev-card')[3].click(); await tick(250);
ok('go-to button names the league', text('#evGoLink').startsWith('Go to league · Winter League 2027'), text('#evGoLink'));
$('#evGoLink').click(); await tick(30);
ok('it navigates to the league', navved && navved[0]==='leagueDetail' && navved[1].league.id===4, JSON.stringify(navved));

// past tab
$$('.ev-tabs .tab')[1].click(); await tick(250);
ok('past count line', text('.ev-count')==='2 past');
const pcards=$$('.ev-card');
ok('You went beats Past', pcards[0].querySelector('.pill').textContent==='You went' && pcards[1].querySelector('.pill').textContent==='Past');
ok('past cards say attended', pcards[0].textContent.includes('44 attended'));
ok('past cards drop the spots line', pcards[0].querySelector('.ev-card-spots').textContent==='');
ok('past events take no action', !$('.ev-action'));
ok('past events hide the bar', !$('.ev-bar'));

// ================= ADMIN =================
state.currentUser = { role:'admin', playerId:null };
renderEvents(); await tick(250);
ok('admins get New event', !!$('#evNew'));
ok('admins get Edit on the hero', !!$('#evEdit'));
ok('admin roster shows columns', !!$('.ev-roster-cols') && !!$('.ev-row-no'));
ok('admin footer has Print and Export', !!$('#evPrintBtn') && !!$('#evExportBtn'));
calls.length=0;
$('.ev-row-x').click(); await tick(250);
ok('remove calls the API with the player', calls.some(c=>c[0]==='removeAttendee' && c[2]===100), JSON.stringify(calls[0]));

// modal: create
$('#evNew').click(); await tick(80);
ok('create modal opens', text('.ev-modal-title')==='New event');
ok('save disabled until valid', $('#evSave').disabled);
$('#evfName').value='Quiz Night'; $('#evfName').dispatchEvent(new Event('input',{bubbles:true}));
$('#evfDate').value='2026-11-20'; $('#evfDate').dispatchEvent(new Event('input',{bubbles:true}));
await tick(30);
ok('save enables when name and date land', !$('#evSave').disabled);
// link search
$('#evfLink').value='winter'; $('#evfLink').dispatchEvent(new Event('input',{bubbles:true})); await tick(120);
ok('search finds the league', $$('.ev-search-row').length===1 && $('.ev-search-row').textContent.includes('Winter League 2027'));
$('.ev-search-row').click(); await tick(60);
ok('picking a link shows the chosen row', text('.ev-linked-name')==='Winter League 2027');
ok('picking a link disables guests', $('#evfGuests').disabled && $('#evfGuests').value==='0');
$('#evfTime').value='19:30'; $('#evfTime').dispatchEvent(new Event('input',{bubbles:true}));
calls.length=0;
$('#evSave').click(); await tick(300);
const made=calls.find(c=>c[0]==='createEvent');
ok('create posts the full body', made && made[1].name==='Quiz Night' && made[1].event_date==='2026-11-20' && made[1].start_time==='19:30' && made[1].guests_allowed===0 && made[1].league_id===4 && made[1].tournament_id===null, made&&JSON.stringify(made[1]));

// modal: edit + two-click delete
await tick(150);
$('#evEdit')?.click(); await tick(80);
ok('edit prefills the form', $('#evfName')?.value==='Back to the Bunker' && $('#evfDate')?.value==='2026-09-18', $('#evfName')?.value);
ok('delete asks first', text('#evDelete')==='Delete event');
$('#evDelete').click(); await tick(40);
ok('then confirms', text('#evDelete')==='Confirm delete' && $('#evDelete').classList.contains('btn-danger'));
calls.length=0;
$('#evDelete').click(); await tick(300);
ok('second click deletes', calls.some(c=>c[0]==='deleteEvent' && c[1]===1));
} catch (e) { fails++; out.push('  THREW  '+e.message+'\n'+(e.stack||'').split('\n').slice(0,4).join('\n')); }
document.getElementById('log').textContent = out.join('\n')+'\n\n'+(fails? fails+' FAILED':'ALL '+out.length+' PASSED');
document.title = fails? 'FAIL':'PASS';
</script></body></html>
