<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com"
    />
    <title>Play WSRC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/assets/logo-blue.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Play WSRC">
    <link rel="apple-touch-icon" href="/assets/logo-blue.png">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Shown only while an admin is viewing the app as a member. -->
  <div class="viewas-bar" id="viewAsBar" hidden>
    <span class="viewas-text">Viewing as <strong id="viewAsName"></strong></span>
    <button class="viewas-btn" id="viewAsExit">Return to admin</button>
  </div>
  <div class="app-container">
      <!-- Sidebar -->
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
      <aside class="sidebar">
        <!-- Desktop wordmark. On mobile this is the admin drawer header (it
             gains the Admin pill); players get the profile header below. -->
        <div class="sidebar-logo">
          <span class="sb-crest"><img src="/assets/WSRC_Logo_Grey%203.png" alt="WSRC"></span>
          <span class="sb-wordmark">
            <span class="sb-word-play">Play</span>
            <span class="sb-word-club">WSRC</span>
          </span>
          <span class="sb-admin-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/></svg>
            Admin
          </span>
        </div>

        <!-- Mobile drawer header for players: tapping it opens their profile. -->
        <button class="sb-drawer-profile" id="sbDrawerProfile">
          <span class="sb-drawer-avatar" id="sbDrawerAvatar"></span>
          <span class="sb-drawer-text">
            <span class="sb-drawer-name" id="sbDrawerName"></span>
            <span class="sb-drawer-sub">Player &middot; View profile</span>
          </span>
          <svg class="sb-drawer-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>

        <nav class="sidebar-nav">
          <div class="sb-group">
            <span class="sb-group-label">Play</span>
            <a class="nav-item" data-page="dashboard">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/></svg>
              Dashboard
            </a>
            <a class="nav-item" data-page="ladder">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M17 3v18M7 8h10M7 13h10M7 18h10"/></svg>
              Ladder
            </a>
            <a class="nav-item" data-page="leagues">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9H21M7 3V5M17 3V5M6 13H8M6 17H8M11 13H13M11 17H13M16 13H18M16 17H18"/><rect x="3" y="5" width="18" height="16" rx="2"/></svg>
              Leagues
            </a>
            <a class="nav-item" id="navTournaments" data-page="tournaments" style="display:none">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3H18V9C18 12.3137 15.3137 15 12 15C8.68629 15 6 12.3137 6 9V3Z"/><path d="M12 15V20M8 20H16M6 7H3C3 10 4.5 12 6 12M18 7H21C21 10 19.5 12 18 12"/></svg>
              Tournaments
            </a>
            <a class="nav-item" data-page="events">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 00-2 2v1.5a2.5 2.5 0 010 5V16a2 2 0 002 2h16a2 2 0 002-2v-1.5a2.5 2.5 0 010-5V8a2 2 0 00-2-2H4zM9 6v3M9 11v2M9 15v3"/></svg>
              Events
            </a>
            <a class="nav-item" id="navCourtBooking" data-page="courtBooking" style="display:none">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/><circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/></svg>
              Book a Court
            </a>
          </div>

          <div class="sb-group">
            <span class="sb-group-label">Club</span>
            <a class="nav-item" data-page="players">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 4.5a3.5 3.5 0 010 7M21.5 20a6.5 6.5 0 00-4-6"/></svg>
              Players
            </a>
            <a class="nav-item" data-page="activity">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15l3.5-4.5 2 2.5 3-9 3.5 12 3.5-9 3 3"/></svg>
              Club Activity
            </a>
          </div>

          <!-- Admins only: the whole group goes, label included, for everyone else. -->
          <div class="sb-group" id="sbGroupAdmin" style="display:none">
            <span class="sb-group-label">Admin</span>
            <a class="nav-item" id="navSchedule" data-page="schedule" style="display:none">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12L16 14"/></svg>
              Court Schedule
            </a>
            <a class="nav-item" id="navClubSettings" data-page="clubSettings" style="display:none">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
              Club Settings
            </a>
          </div>
        </nav>

        <!-- Player account menu, opened by the profile card below it. -->
        <div class="sb-menu" id="sbMenu" role="menu" hidden>
          <button class="sb-menu-item" id="sbMenuProfile" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
            My Profile
          </button>
          <span class="sb-menu-divider"></span>
          <a class="sb-menu-item sb-menu-item--danger" href="/logout" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            Logout
          </a>
        </div>

        <button class="sb-profile" id="sbProfile" aria-haspopup="menu" aria-expanded="false" aria-controls="sbMenu">
          <span class="sb-profile-avatar" id="sbProfileAvatar"></span>
          <span class="sb-profile-text">
            <span class="sb-profile-name" id="sbProfileName"></span>
            <span class="sb-profile-role">Player</span>
          </span>
          <svg class="sb-profile-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
        </button>

        <div class="sb-admin">
          <span class="sb-admin-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9.5 12l1.8 1.8L15 10"/></svg>
          </span>
          <span class="sb-admin-text">
            <span class="sb-admin-name">Administrator</span>
            <span class="sb-admin-sub">Club management</span>
          </span>
          <a class="sb-admin-logout" href="/logout" title="Logout" aria-label="Logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </a>
        </div>

        <!-- Mobile only: the drawer exposes logout directly instead of a popover. -->
        <div class="sb-drawer-foot">
          <a class="sb-drawer-logout" href="/logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
            Logout
          </a>
        </div>
      </aside>

      <!-- Main area -->
      <div class="main-wrapper">
        <header class="topbar">
          <div class="topbar-left">
            <button class="btn-back" id="btnBack" style="display:none">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
              </svg>
              Back
            </button>
            <h1 class="topbar-title" id="pageTitle">Players</h1>
          </div>
          <div class="topbar-actions" id="topbarActions"></div>
        </header>

        <main class="content" id="mainContent"></main>
      </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle"></h2>
          <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <!-- Quill (vendored: the CSP meta above allows scripts from 'self' only)
         powers the rich-text editor in the Message Players modal -->
    <link href="vendor/quill/quill.snow.css" rel="stylesheet">
    <script src="vendor/quill/quill.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
